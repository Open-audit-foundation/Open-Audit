openapi: 3.0.0
info:
  title: Open-Audit API
  description: API for Open-Audit's translated data feeds, allowing developers to ingest historical contract events and monitor real-time feeds.
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local development server
security:
  - BearerAuth: []
paths:
  /api/ingest-historical:
    post:
      summary: Ingest historical ledger range
      description: Fetches and backfills contract events from a specified historical ledger range.
      operationId: ingestHistorical
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - contractId
                - startSequence
                - endSequence
              properties:
                contractId:
                  type: string
                  description: The Soroban contract ID to fetch events for.
                  example: "CABC123..."
                startSequence:
                  type: integer
                  description: The starting ledger sequence number (inclusive).
                  example: 1000
                endSequence:
                  type: integer
                  description: The ending ledger sequence number (inclusive).
                  example: 5000
                chunkSize:
                  type: integer
                  description: Number of ledgers per chunk to avoid RPC limits.
                  example: 1000
      responses:
        '200':
          description: Successful ingestion
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  contractId:
                    type: string
                  range:
                    type: object
                    properties:
                      start:
                        type: integer
                      end:
                        type: integer
                  results:
                    type: object
                    properties:
                      totalEvents:
                        type: integer
                      totalChunks:
                        type: integer
                      events:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            type:
                              type: string
                            ledger:
                              type: integer
                            createdAt:
                              type: string
                              format: date-time
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - Invalid or missing API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
          headers:
            WWW-Authenticate:
              schema:
                type: string
              description: Bearer realm indication
        '429':
          description: Too Many Requests - Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsError'
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying
            X-RateLimit-Limit:
              schema:
                type: integer
              description: Request limit per window
            X-RateLimit-Remaining:
              schema:
                type: integer
              description: Remaining requests in current window
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/events/export:
    get:
      summary: Export translated events
      description: Streams translated contract events as CSV, JSON, or NDJSON.
      operationId: exportEvents
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [csv, json, ndjson]
            default: csv
          description: Export file format
        - name: contractId
          in: query
          required: false
          schema:
            type: string
          description: Soroban contract address filter
        - name: startLedger
          in: query
          required: false
          schema:
            type: integer
          description: Starting ledger sequence (inclusive)
        - name: endLedger
          in: query
          required: false
          schema:
            type: integer
          description: Ending ledger sequence (inclusive)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100000
            maximum: 1000000
          description: Maximum rows to export
      responses:
        '200':
          description: Export file stream
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: array
                items:
                  type: object
            application/x-ndjson:
              schema:
                type: string
                format: binary
        '401':
          description: Unauthorized - Invalid or missing API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '429':
          description: Too Many Requests - Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsError'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: oa_live_<hex>
      description: |
        API key authentication using the standard Authorization: Bearer header.
        Keys have the format `oa_live_<48 hex chars>`.
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error type or classification
        message:
          type: string
          description: Human-readable error description
        details:
          type: string
    UnauthorizedError:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          enum: ["Unauthorized"]
          example: "Unauthorized"
        message:
          type: string
          example: "Invalid or missing API key"
    TooManyRequestsError:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          enum: ["Too Many Requests"]
          example: "Too Many Requests"
        message:
          type: string
          example: "Rate limit exceeded. Check the Retry-After header."
